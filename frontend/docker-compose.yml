services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: clinica-frontend
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      API_URL: http://clinica-app:3000
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: sh -c "npm install && npm run dev"
    networks:
      - clinica-network

networks:
  clinica-network:
    external: true
