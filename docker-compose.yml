services:
  db:
    image: postgres:16.8-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinica_usuario
      POSTGRES_PASSWORD: clinica123
      POSTGRES_DB: clinica_db
    ports:
      - "5432:5432"
    networks:
      - rede
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica_usuario -d clinica_db"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - rede

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      API_URL: http://backend:3000
    command: npm run dev
    networks:
      - rede

networks:
  rede:
    driver: bridge