services:
  db:
    image: postgres:16.8-bookworm
    container_name: postgres-clinica
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: minhasenha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - clinica-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: clinica-app
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: npm run start:dev
    networks:
      - clinica-network

volumes:
  pgdata:

networks:
  clinica-network:
    external: true
